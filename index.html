<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Diperbaiki: Dihapus user-scalable=no demi aksesibilitas & UX -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Koreksi Ljk AI</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios/50/bot.png">
    
    <style>
        /* Reset Box Model */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh; /* Fallback browser lama */
            height: 100dvh; /* Viewport Height Dinamis untuk HP */
            overflow: hidden;
            background-color: #f6f7fb;
        }
        
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- Diperbaiki: Menambahkan atribut title untuk aksesibilitas -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbw1B-KPv5qjRGXJnnZPK3mqc3g-HPBoiLCX2HkR113sYSuTKX3TMgqqSceIGkZcMltw/exec" 
        title="Aplikasi Koreksi LJK AI"
        allow="geolocation; camera; microphone" 
        allowfullscreen>
    </iframe>

</body>
</html>
